name: Release Image (fork)

# Fork-only: builds this branch's image when a version tag is pushed (publishing a GitHub release with a
# new tag does that) and pushes it to ghcr.io/<owner>/<repo> tagged with the version and the commit SHA.
#
# Upstream's own workflows (image promotion from `main`, Vercel and Cloudflare checks, Crowdin sync,
# issue triage, autofix, E2E) are removed on this branch: they target upstream's infrastructure and
# only failed or made noise here. After merging upstream, keep them deleted.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha

      # Image names must be lowercase; the repository name is not.
      - name: Cache image name
        id: cache
        run: echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache, not the Actions cache: that one is scoped to the ref, so every new tag
          # would start cold. This one is shared by all tags.
          cache-from: type=registry,ref=ghcr.io/${{ steps.cache.outputs.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.cache.outputs.image }}:buildcache,mode=max
